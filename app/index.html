<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten a link</title>
<style>
  :root {
    --blue: #0069ff; --blue-dark: #0052cc; --navy: #031b4e; --gray: #5b6b8c;
    --line: #dfe4ee; --bg: #ffffff; --soft: #f5f7fb; --red: #c0392b; --green: #1a7f37;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--navy);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--gray); margin: 0 0 28px; }
  form .row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; font: inherit; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px;
    color: var(--navy); background: var(--bg); outline: none; min-width: 0;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,105,255,.15); }
  button {
    font: inherit; font-weight: 600; padding: 14px 22px; border: 0; border-radius: 8px;
    background: var(--blue); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: var(--blue-dark); }
  button:disabled { opacity: .6; cursor: default; }
  .link { background: none; color: var(--blue); padding: 0; font-weight: 500; }
  .link:hover { background: none; text-decoration: underline; }
  .alias { display: none; margin-top: 12px; align-items: center; gap: 10px; color: var(--gray); font-size: 14px; }
  .alias.open { display: flex; }
  .alias span { white-space: nowrap; }
  .alias input { padding: 10px 12px; font-size: 14px; }
  .hint { margin-top: 12px; font-size: 14px; }
  .error { color: var(--red); margin-top: 12px; font-size: 14px; min-height: 1.4em; }
  #result { display: none; }
  .card { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; }
  .short { font-size: 22px; font-weight: 600; word-break: break-all; margin: 0 0 4px; }
  .short a { color: var(--blue); text-decoration: none; }
  .short a:hover { text-decoration: underline; }
  .to { color: var(--gray); font-size: 14px; word-break: break-all; margin: 0 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta { color: var(--gray); font-size: 14px; margin-left: auto; }
  .again { margin-top: 18px; }
  #history { display: none; margin-top: 40px; }
  #history h2 { font-size: 14px; font-weight: 600; color: var(--gray); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .hist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .hist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hist .s { color: var(--blue); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .hist .s:hover { text-decoration: underline; }
  .hist .l { color: var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .hist .c { color: var(--gray); white-space: nowrap; }
  .hist .d { background: none; color: var(--gray); padding: 4px 6px; font-weight: 500; font-size: 13px; }
  .hist .d:hover { background: none; color: var(--red); }
  footer { margin-top: 40px; text-align: center; font-size: 13px; color: var(--gray); }
  footer a { color: var(--gray); }
</style>
</head>
<body>
<main>
  <section id="create">
    <h1>Shorten a link</h1>
    <p class="sub">Paste a long address. Get a short one.</p>
    <form id="form">
      <div class="row">
        <input id="url" type="text" inputmode="url" placeholder="youtube.com" required autofocus autocomplete="off" spellcheck="false">
        <button id="submit" type="submit">Shorten</button>
      </div>
      <div class="hint"><button type="button" class="link" id="toggle">Choose your own name</button></div>
      <div class="alias" id="aliasRow">
        <span id="host"></span>
        <input id="alias" type="text" placeholder="my-link" maxlength="32" pattern="[A-Za-z0-9_\-]{3,32}" title="3 to 32 letters, digits, hyphen or underscore" autocomplete="off" spellcheck="false">
      </div>
    </form>
    <div class="error" id="error" role="alert"></div>
  </section>

  <section id="result">
    <div class="card">
      <p class="short"><a id="shortLink" href="#" target="_blank" rel="noopener"></a></p>
      <p class="to" id="longUrl"></p>
      <div class="row">
        <button id="copy" type="button">Copy</button>
        <span class="meta" id="meta"></span>
      </div>
    </div>
    <div class="again"><button type="button" class="link" id="again">Shorten another</button></div>
  </section>

  <section id="history">
    <h2>Your links</h2>
    <ul class="hist" id="hist"></ul>
  </section>

  <footer><a href="/docs">API</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const host = location.origin + "/";
  $("host").textContent = host;

  $("toggle").addEventListener("click", () => {
    $("aliasRow").classList.toggle("open");
    if ($("aliasRow").classList.contains("open")) $("alias").focus();
  });

  $("alias").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); $("form").requestSubmit(); }
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    $("submit").disabled = true;
    let url = $("url").value.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;  // people type youtube.com, the API wants a scheme
    const body = { long_url: url };
    const alias = $("alias").value.trim();
    if ($("aliasRow").classList.contains("open") && alias) body.alias = alias;
    try {
      const r = await fetch("/v1/links", {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
      });
      const data = await r.json();
      if (!r.ok) { $("error").textContent = data.error || "Something went wrong."; return; }
      show(data);
    } catch {
      $("error").textContent = "Could not reach the server.";
    } finally {
      $("submit").disabled = false;
    }
  });

  // Links made in this browser, newest first. There is no login, so "yours" means "made here".
  const KEY = "links";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = (list) => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} };

  function remember(link) {
    const list = load().filter((l) => l.code !== link.code);
    list.unshift({ code: link.code, short_url: link.short_url, long_url: link.long_url });
    save(list.slice(0, 50));
    render();
  }

  async function render() {
    const list = load();
    $("history").style.display = list.length ? "block" : "none";
    $("hist").innerHTML = "";
    for (const l of list) {
      const li = document.createElement("li");
      const a = document.createElement("a"); a.className = "s"; a.href = l.short_url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = l.short_url.replace(/^https?:\/\//, "");
      const long = document.createElement("span"); long.className = "l"; long.textContent = l.long_url; long.title = l.long_url;
      const count = document.createElement("span"); count.className = "c"; count.textContent = "…";
      const del = document.createElement("button"); del.type = "button"; del.className = "d"; del.textContent = "Delete";
      del.addEventListener("click", async () => {
        del.disabled = true;
        const r = await fetch("/v1/links/" + encodeURIComponent(l.code), { method: "DELETE" });
        if (r.ok || r.status === 404) { save(load().filter((x) => x.code !== l.code)); render(); }
        else { del.disabled = false; count.textContent = "could not delete"; }
      });
      li.append(a, long, count, del);
      $("hist").appendChild(li);
      fetch("/v1/links/" + encodeURIComponent(l.code))
        .then((r) => r.ok ? r.json() : null)
        .then((m) => { count.textContent = m ? `${m.hit_count} click${m.hit_count === 1 ? "" : "s"}` : "gone"; })
        .catch(() => { count.textContent = ""; });
    }
  }

  render();

  function show(link) {
    remember(link);
    $("shortLink").textContent = link.short_url.replace(/^https?:\/\//, "");
    $("shortLink").href = link.short_url;
    $("longUrl").textContent = "→ " + link.long_url;
    $("meta").textContent = link.custom ? "custom name" : "generated name";
    $("create").style.display = "none";
    $("result").style.display = "block";
    $("copy").textContent = "Copy";
    $("copy").dataset.url = link.short_url;
  }

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("copy").dataset.url); $("copy").textContent = "Copied"; }
    catch { $("copy").textContent = "Select and copy"; }
    setTimeout(() => { $("copy").textContent = "Copy"; }, 1500);
  });

  $("again").addEventListener("click", () => {
    $("form").reset();
    $("aliasRow").classList.remove("open");
    $("result").style.display = "none";
    $("create").style.display = "block";
    $("url").focus();
  });
</script>
</body>
</html>
